[functions.reuben-ai]
enabled = true

# 🔥 FIX: avoid auth blocking frontend calls
verify_jwt = false

import_map = "./functions/reuben-ai/deno.json"
entrypoint = "./functions/reuben-ai/index.ts"

[functions.media-edit]
enabled = true
verify_jwt = true
entrypoint = "./functions/media-edit/index.ts"

[functions.billing-checkout]
enabled = true
verify_jwt = true
import_map = "./functions/billing-checkout/deno.json"
entrypoint = "./functions/billing-checkout/index.ts"

[functions.feedback-notification]
enabled = true
verify_jwt = true
entrypoint = "./functions/feedback-notification/index.ts"

[functions.stripe-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/stripe-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/stripe-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/stripe-webhook/*.html" ]
